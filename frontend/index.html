<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <div class="logo">
                <div class="logo-icon">✓</div>
                <span>TaskFlow</span>
            </div>

            <nav class="navigation">

                <a href="#" class="nav-item active">
                    <span>▣</span>
                    <span>Dashboard</span>
                </a>

            </nav>

            <div class="sidebar-bottom">

                <button id="themeButton" class="theme-button">
                    <span id="themeIcon">☾</span>
                    <span>Dark Mode</span>
                </button>

            </div>

        </aside>


        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main class="main-content">


            <!-- TOP BAR -->

            <header class="topbar">

                <div>

                    <p class="welcome-text">
                        Welcome back 👋
                    </p>

                    <h1>My Tasks</h1>

                </div>

                <div
                    class="date"
                    id="currentDate">
                </div>

            </header>


            <!-- =========================
                 STATISTICS
            ========================== -->

            <section class="stats">


                <!-- TOTAL -->

                <div class="stat-card">

                    <div class="stat-icon blue">
                        📋
                    </div>

                    <div>

                        <p>Total Tasks</p>

                        <h2 id="totalTasks">
                            0
                        </h2>

                    </div>

                </div>


                <!-- COMPLETED -->

                <div class="stat-card">

                    <div class="stat-icon green">
                        ✓
                    </div>

                    <div>

                        <p>Completed</p>

                        <h2 id="completedTasks">
                            0
                        </h2>

                    </div>

                </div>


                <!-- PENDING -->

                <div class="stat-card">

                    <div class="stat-icon orange">
                        ◷
                    </div>

                    <div>

                        <p>Pending</p>

                        <h2 id="pendingTasks">
                            0
                        </h2>

                    </div>

                </div>

            </section>


            <!-- =========================
                 ADD TASK
            ========================== -->

            <section class="add-section">

                <div class="section-title">

                    <h2>
                        Add a new task
                    </h2>

                    <p>
                        Stay organized and get things done.
                    </p>

                </div>


                <form
                    id="taskForm"
                    class="task-form">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What needs to be done?"
                        autocomplete="off"
                        required
                    >

                    <button type="submit">
                        + Add Task
                    </button>

                </form>

            </section>


            <!-- =========================
                 TASKS SECTION
            ========================== -->

            <section
                class="tasks-section"
                id="tasks">


                <!-- TASK HEADER -->

                <div class="tasks-header">

                    <div>

                        <h2>
                            My Tasks
                        </h2>

                        <p id="taskCountText">
                            0 tasks
                        </p>

                    </div>


                    <!-- SEARCH -->

                    <div class="task-controls">

                        <div class="search-box">

                            <span>
                                🔍
                            </span>

                            <input
                                type="text"
                                id="searchInput"
                                placeholder="Search tasks..."
                            >

                        </div>

                    </div>

                </div>


                <!-- =========================
                     FILTER BUTTONS
                ========================== -->

                <div class="filters">

                    <button
                        class="filter-button active"
                        data-filter="all">

                        All

                    </button>


                    <button
                        class="filter-button"
                        data-filter="active">

                        Active

                    </button>


                    <button
                        class="filter-button"
                        data-filter="completed">

                        Completed

                    </button>

                </div>


                <!-- =========================
                     ERROR / MESSAGE
                ========================== -->

                <div
                    id="message"
                    class="message">
                </div>


                <!-- =========================
                     TASK LIST
                ========================== -->

                <div
                    id="taskList"
                    class="task-list">
                </div>


                <!-- =========================
                     EMPTY STATE
                ========================== -->

                <div
                    id="emptyState"
                    class="empty-state">

                    <div class="empty-icon">
                        ✓
                    </div>

                    <h3>
                        No tasks found
                    </h3>

                    <p>
                        Add a task to get started.
                    </p>

                </div>

            </section>

        </main>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
